<!DOCTYPE html>
<html lang="en">
<head>
    <title>login</title>
    <meta content="text/html; charset=utf-8" http-equiv="Content-Type" />
    <meta name="content-language" content="fa" />
    <meta content="width=device-width, initial-scale=1,maximum-scale=1, user-scalable=no" name="viewport" />
    <meta name="fontiran.com:license" content="HU4G5">
    <link href="css/bootstrap.min.css" rel="stylesheet" type="text/css" />
    <link href="css/fontawesome.css" rel="stylesheet" type="text/css" >
    <link href="css/solid.css" rel="stylesheet" type="text/css" >
    <link href="css/light.css" rel="stylesheet" type="text/css" >
    <link href="css/WhiteTheme.css?v=1.1" rel="stylesheet" type="text/css" >
</head>
<body>
<section class="wrapperLogin">
    <section class="container-fluid userLogin" >
        <div class="logoImage">
            <img src="css/images/fatehlogo.svg"></img>
        </div>
        <div>
            <div class="loginItemInput">
                <div class="brdr"></div>
                <div class="lbl"> <span> نام کاربـری</span></div>
                <div class="txt"><input  type="text"></div>
                <div class="ico"><i class="fa-light fa-keyboard"></i></div>
            </div>
            <div class="loginItemInput">
                <div class="brdr"></div>
                <div class="lbl"><span>رمز عبور</span></div>
                <div class="txt"><input  type="password"></div>
                <div class="ico"><i class="fa-light fa-keyboard"></i></div>
            </div>
            <div class="loginCommand">
                <div class="remember">
                    <label class="control control--checkbox">
                        <span class="per-word">مرا به خاطر بسپار</span>
                        <input type="checkbox" />
                        <div class="control__indicator"></div>
                    </label>
                </div>
                <div class="command">
                    <a>ورود</a>
                </div>
            </div>
        </div>
    </section>
    <hr />
    <section class="footer-login">
        <div class="desc-key">
            <div><span class="colorRed">هشدار امنیتی : </span>برای ورود به سامانه از صفحه کلید مجازی استفاده کنید.</div>
            <div><span class="colorRed">کنترل پنل</span> - تمامی حقوق محفوظ می باشد.</div>
        </div>
        <div class="desc-two-auth">برای افزایش  امنیت از روش <span class="colorRed"> ورود دو عاملی </span>  استفاده کنید.</div>
    </section>
</section>
</body>
</html>
