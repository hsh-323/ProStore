name: Visual homepage preview

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "css/prostore-home-v2.css"
      - "css/prostore-home-polish.css"
      - "js/prostore-home-v2.js"
      - ".github/workflows/visual-preview.yml"
  workflow_dispatch:

jobs:
  screenshot:
    runs-on: ubuntu-latest
    steps:
      - name: Check out site
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Chromium
        run: npx --yes playwright install chromium
      - name: Start static site
        run: |
          python3 -m http.server 8080 --bind 127.0.0.1 >/tmp/prostore-http.log 2>&1 &
          echo $! >/tmp/prostore-http.pid
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8080/index.html >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/prostore-http.log
          exit 1
      - name: Capture desktop and mobile views
        run: |
          mkdir -p visual-preview
          cat > visual-preview/assets-gallery.html <<'HTML'
          <!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><title>ProStore asset gallery</title><style>body{font-family:Arial,sans-serif;background:#f2f3f5;margin:0;padding:20px}h1{font-size:22px}main{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}.tile{background:white;border-radius:10px;padding:10px;box-shadow:0 1px 5px #ddd}.tile img{width:100%;height:180px;object-fit:contain;background:#fafafa}.tile b{display:block;margin-top:8px;font-size:14px;direction:ltr;text-align:left}.tile span{display:block;font-size:11px;color:#666}</style></head><body><h1>ProStore — Local banners and promotional images</h1><main>
          HTML
          for name in swiper1.webp swiper11.webp swiper13.webp swiper15.webp swiper16.webp swiper4.webp swiper6.webp swiper7.jpg swiper8.webp swiper9.webp swiper10.webp swiper12.webp swiper14.webp adv11.webp adv8.webp adv8-sm.webp half1.webp half2.webp half3.webp half4.webp half5.webp product1.webp product4.webp product6.webp product7.webp product9.webp product10.webp product-d1.webp product-d2.jpg product-d3.jpg product-d4.jpg product-d1-sm.webp product-d2-sm.jpg product-d3-sm.jpg product-d4-sm.jpg; do
            printf '<div class="tile"><img src="../css/images/%s" loading="eager"><b>%s</b><span>css/images/%s</span></div>\n' "$name" "$name" "$name" >> visual-preview/assets-gallery.html
          done
          echo '</main></body></html>' >> visual-preview/assets-gallery.html
          npx --yes playwright screenshot --browser chromium --viewport-size "1600,1500" --full-page --wait-for-timeout 900 http://127.0.0.1:8080/visual-preview/assets-gallery.html visual-preview/assets-gallery.png
          npx --yes playwright screenshot --browser chromium --viewport-size "1440,1000" --wait-for-timeout 1200 http://127.0.0.1:8080/index.html visual-preview/prostore-first-screen.png
          npx --yes playwright screenshot --browser chromium --viewport-size "1440,1000" --full-page --wait-for-timeout 1200 http://127.0.0.1:8080/index.html visual-preview/prostore-desktop.png
          npx --yes playwright screenshot --browser chromium --viewport-size "390,844" --full-page --wait-for-timeout 1200 http://127.0.0.1:8080/index.html visual-preview/prostore-mobile.png
          npx --yes playwright screenshot --browser chromium --viewport-size "1440,1000" --wait-for-timeout 8000 https://www.digikala.com/ visual-preview/digikala-reference.png || echo "Could not capture remote Digikala reference; ProStore screenshots are still available."
      - name: Upload rendered screenshots
        uses: actions/upload-artifact@v4
        with:
          name: prostore-visual-preview
          path: visual-preview/
          retention-days: 7
